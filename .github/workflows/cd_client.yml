name: Deploy frontend
on:
  push:
    branches: ["main"]
    paths:
      - "client/**"
      - ".github/workflows/cd_client.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build docker image and push to dockerhub
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fintel-frontend:latest
          build-args: |
            VITE_CLIENT_ID=${{ secrets.VITE_CLIENT_ID }}
            VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}

      - name: copy docker compose file to ec2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/fintel"

      - name: deploy to ec2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            echo "enter to fintel directory"
            cd /home/ubuntu/fintel
             
            echo "login to docker"
            echo '${{ secrets.DOCKER_PASSWORD }}' | sudo docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin

            echo "pulling latest image"
            sudo docker compose -f docker-compose.prod.yml pull frontend

            echo "docker compose up"
            sudo docker compose -f docker-compose.prod.yml up -d frontend

            sudo docker compose -f docker-compose.prod.yml ps

            echo "Cleaning old images"
            sudo docker image prune -f
