name: Deploy backend
on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/cd_server.yml"
      - "docker-compose.prod.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build docker image and push to dockerhub
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fintel-api:latest

      - name: copy docker compose file to ec2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/fintel"

      - name: deploy to ec2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            echo "enter the fintel directory"
            cd /home/ubuntu/fintel

            echo "login to docker"
            echo '${{ secrets.DOCKER_PASSWORD }}' | sudo docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin

            echo "pulling latest image"
            sudo docker compose -f docker-compose.prod.yml pull api

            echo "docker compose up"
            sudo docker compose -f docker-compose.prod.yml up -d api worker

            sudo docker compose -f docker-compose.prod.yml ps

            echo "cleaning old images"
            sudo docker image prune -f
